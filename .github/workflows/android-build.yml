name: SonicShield Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SonicShield APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify project files
        shell: bash
        run: |
          echo "Repository root: $GITHUB_WORKSPACE"
          ls -la
          test -f settings.gradle.kts || { echo "ERROR: settings.gradle.kts is missing from repository root"; exit 1; }
          test -f build.gradle.kts || { echo "ERROR: build.gradle.kts is missing from repository root"; exit 1; }
          test -f app/build.gradle.kts || { echo "ERROR: app/build.gradle.kts is missing"; exit 1; }

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace clean :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SonicShield-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
